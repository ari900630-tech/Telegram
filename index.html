<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#229ED9">
  <title>Telegram — פתיחת המסנג׳ר</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eaf7ff,#f7fbff 55%,#e8f4fc);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#183247}
    main{width:min(100%,460px);padding:34px 26px;text-align:center;background:#fff;border:1px solid #dcebf4;border-radius:28px;box-shadow:0 18px 55px #194f6b18}
    .logo{width:78px;height:78px;margin:0 auto 20px;border-radius:24px;background:#229ed9;display:grid;place-items:center;color:white;font-size:38px}
    h1{margin:0 0 12px;font-size:29px}p{line-height:1.7;color:#557084;margin:0 0 24px}
    a.primary{display:block;padding:15px 18px;background:#229ed9;color:white;text-decoration:none;border-radius:14px;font-weight:700;font-size:17px}
    a.secondary{display:inline-block;margin-top:18px;color:#1684b8;text-decoration:none}
    small{display:block;margin-top:24px;color:#7c909e;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">➤</div>
    <h1>Telegram</h1>
    <p>פתיחת Telegram בדפדפן כדי להתחבר לחשבון ולשלוח הודעות.</p>
    <a class="primary" href="https://web.telegram.org/" rel="noopener noreferrer">פתיחת Telegram Web</a>
    <a class="secondary" href="https://github.com/ari900630-tech/Telegram">צפייה בקוד המקור ב‑GitHub</a>
    <small>דף זה הוא שער כניסה בלבד. ההתחברות וההודעות מתבצעות באתר הרשמי של Telegram.</small>
  </main>
</body>
</html>
